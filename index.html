<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Minha Agenda</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --p:#2563eb;
  --soft:#eff6ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,sans-serif;
  padding-bottom:80px;
}

.app{
  max-width:760px;
  margin:auto;
  padding:18px;
}

header,.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

h1{
  font-size:24px;
}

h2{
  font-size:20px;
}

.hero,.card,.stat,.note{
  background:var(--card);
  border-radius:20px;
  box-shadow:0 8px 30px #0000000d;
  padding:17px;
  margin-bottom:14px;
}

.hero{
  padding:22px;
}

.hero .date{
  color:var(--p);
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat strong{
  font-size:24px;
  display:block;
}

.stat span{
  font-size:12px;
  color:var(--muted);
}

button{
  border:0;
  cursor:pointer;
}

.icon{
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--card);
  color:var(--text);
}

.primary{
  background:var(--p);
  color:white;
  border-radius:13px;
  padding:11px 15px;
  font-weight:700;
}

.edit{
  background:var(--soft);
  color:var(--p);
  border-radius:10px;
  padding:8px 11px;
  font-weight:700;
}

.danger{
  color:#dc2626;
  background:transparent;
  padding:8px 11px;
}

.map-button{
  background:#dcfce7;
  color:#15803d;
  border-radius:10px;
  padding:8px 11px;
  font-weight:700;
}

body.dark .map-button{
  background:#052e16;
  color:#4ade80;
}

.list{
  display:grid;
  gap:10px;
}

.item{
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
}

.item-title{
  font-weight:700;
}

.item-actions{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}

.done{
  text-decoration:line-through;
  opacity:.5;
}

.task-line{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.task-line input{
  width:20px;
  height:20px;
  margin-top:2px;
}


/* =========================
   PRIORIDADE DAS TAREFAS
========================= */

.priority{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  margin-left:8px;
  white-space:nowrap;
}

.priority-alta{
  background:#fee2e2;
  color:#dc2626;
}

.priority-normal{
  background:#fef3c7;
  color:#b45309;
}

.priority-baixa{
  background:#dbeafe;
  color:#2563eb;
}

body.dark .priority-alta{
  background:#450a0a;
  color:#f87171;
}

body.dark .priority-normal{
  background:#451a03;
  color:#fbbf24;
}

body.dark .priority-baixa{
  background:#172554;
  color:#60a5fa;
}


section{
  display:none;
}

section.active{
  display:block;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--card);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index:5;
}

.nav button{
  background:transparent;
  color:var(--muted);
  padding:8px;
  border-radius:12px;
  font-size:12px;
}

.nav button.active{
  background:var(--soft);
  color:var(--p);
  font-weight:700;
}


/* =========================
   BOTÃO +
========================= */

.fab{
  position:fixed;
  right:20px;
  bottom:90px;
  width:58px;
  height:58px;
  border-radius:20px;
  background:var(--p);
  color:#fff;
  font-size:28px;
  z-index:7;
  transition:.2s ease;
}

.fab.open{
  transform:rotate(45deg);
}


/* =========================
   MENU DO +
========================= */

.fab-menu{
  position:fixed;
  right:20px;
  bottom:158px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  z-index:6;

  opacity:0;
  transform:translateY(10px) scale(.95);
  pointer-events:none;

  transition:.2s ease;
}

.fab-menu.show{
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
}

.fab-option{
  display:flex;
  align-items:center;
  gap:9px;

  background:var(--card);
  color:var(--text);

  border:1px solid var(--line);
  border-radius:15px;

  padding:10px 14px;

  box-shadow:0 8px 25px #0002;

  font-weight:700;
  font-size:14px;
}

.fab-option span{
  font-size:20px;
}


.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cal button{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--soft);
  color:var(--p);
}

.week,.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  text-align:center;
}

.week{
  color:var(--muted);
  font-size:12px;
  margin:12px 0 5px;
}

.day{
  min-height:40px;
  border-radius:10px;
  background:transparent;
  color:var(--text);
}

.today{
  background:var(--p);
  color:#fff;
}

.has{
  border:1px solid var(--p);
}

.day.selected{
  outline:3px solid var(--p);
  outline-offset:1px;
}

.notes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.note{
  margin:0;
  box-shadow:none;
  border:1px solid var(--line);
  min-height:130px;
}

.note p{
  white-space:pre-wrap;
  color:var(--muted);
  font-size:14px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  margin:6px 0 12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--bg);
  color:var(--text);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  z-index:10;
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:760px;
  margin:auto;
  background:var(--card);
  border-radius:24px 24px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.actions{
  display:flex;
  gap:10px;
}

.actions>*{
  flex:1;
}

body.dark{
  --bg:#0b1220;
  --card:#111827;
  --text:#f9fafb;
  --muted:#9ca3af;
  --line:#263247;
  --soft:#172554;
}

@media(min-width:650px){

  .modal{
    align-items:center;
  }

  .box{
    border-radius:24px;
    max-width:560px;
  }

  .notes{
    grid-template-columns:repeat(3,1fr);
  }

}
</style>
</head>


<body>

<div class="app">

<header>

  <div>

    <div style="
      font-size:13px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:.08em;
      margin-bottom:6px
    ">
      ORGANIZAÇÃO
    </div>

    <h1 style="margin:0">
      Minha Agenda
    </h1>

  </div>

  <button
    class="icon"
    id="theme">
    🌙
  </button>

</header>


<!-- =========================
     INÍCIO
========================= -->

<section
  id="home"
  class="active">

  <div class="hero">

    <div
      class="date"
      id="date">
    </div>

    <h2>
      Seu dia, do seu jeito.
    </h2>

    <div class="muted">
      Compromissos, tarefas e anotações em um só lugar.
    </div>

  </div>


  <div class="stats">

    <div class="stat">

      <strong id="ec">
        0
      </strong>

      <span>
        Compromissos
      </span>

    </div>


    <div class="stat">

      <strong id="tc">
        0
      </strong>

      <span>
        Tarefas abertas
      </span>

    </div>


    <div class="stat">

      <strong id="nc">
        0
      </strong>

      <span>
        Anotações
      </span>

    </div>

  </div>


  <div class="card">

    <h2>
      Compromissos de hoje
    </h2>

    <div
      id="up"
      class="list">
    </div>

  </div>


  <div class="card">

    <h2>
      Tarefas
    </h2>

    <div
      id="today"
      class="list">
    </div>

  </div>

</section>


<!-- =========================
     AGENDA
========================= -->

<section id="agenda">

  <div class="card">

    <div class="calendar-head">

      <h2 id="month"></h2>

      <div class="cal">

        <button id="prev">
          ‹
        </button>

        <button id="next">
          ›
        </button>

      </div>

    </div>


    <div class="week">

      <span>Dom</span>
      <span>Seg</span>
      <span>Ter</span>
      <span>Qua</span>
      <span>Qui</span>
      <span>Sex</span>
      <span>Sáb</span>

    </div>


    <div
      id="cal"
      class="days">
    </div>

  </div>


  <div class="card">

    <div class="row">

      <h2 id="eventsTitle">
        Compromissos
      </h2>

      <div style="display:flex;gap:6px">

        <button
          class="edit"
          id="showAll"
          style="display:none">

          Ver todos

        </button>

        <button
          class="primary"
          data-new="event">

          + Novo

        </button>

      </div>

    </div>

    <div
      id="events"
      class="list">
    </div>

  </div>

</section>


<!-- =========================
     TAREFAS
========================= -->

<section id="tasks">

  <div class="card">

    <div class="row">

      <h2>
        Tarefas
      </h2>

      <button
        class="primary"
        data-new="task">
        + Nova
      </button>

    </div>

    <div
      id="tasksList"
      class="list">
    </div>

  </div>

</section>


<!-- =========================
     NOTAS
========================= -->

<section id="notes">

  <div class="card">

    <div class="row">

      <h2>
        Anotações
      </h2>

      <button
        class="primary"
        data-new="note">
        + Nova
      </button>

    </div>


    <input
      id="search"
      placeholder="🔎 Pesquisar anotações...">


    <div
      id="notesList"
      class="notes">
    </div>

  </div>

</section>

</div>


<!-- =========================
     MENU DO +
========================= -->

<div
  class="fab-menu"
  id="fabMenu">

  <button
    class="fab-option"
    data-fab-new="event">

    <span>
      📅
    </span>

    Compromisso

  </button>


  <button
    class="fab-option"
    data-fab-new="task">

    <span>
      ✅
    </span>

    Tarefa

  </button>


  <button
    class="fab-option"
    data-fab-new="note">

    <span>
      📝
    </span>

    Nota

  </button>

</div>


<!-- =========================
     BOTÃO +
========================= -->

<button
  class="fab"
  id="fab">
  +
</button>


<!-- =========================
     NAVEGAÇÃO
========================= -->

<nav class="nav">

  <button
    class="active"
    data-go="home">

    🏠<br>
    Início

  </button>


  <button data-go="agenda">

    📅<br>
    Agenda

  </button>


  <button data-go="tasks">

    ☑️<br>
    Tarefas

  </button>


  <button data-go="notes">

    📝<br>
    Notas

  </button>

</nav>


<!-- =========================
     JANELA DE ADICIONAR / EDITAR
========================= -->

<div
  class="modal"
  id="modal">

  <div class="box">

    <div class="row">

      <h2 id="mtitle">
        Novo
      </h2>

      <button
        class="icon"
        id="close">

        ✕

      </button>

    </div>

    <form id="form"></form>

  </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAsf0YLK7c5FOBuw8q05iETDIGTjANkHKE",

  authDomain:
    "minha-agenda-253ad.firebaseapp.com",

  projectId:
    "minha-agenda-253ad",

  storageBucket:
    "minha-agenda-253ad.firebasestorage.app",

  messagingSenderId:
    "56708978577",

  appId:
    "1:56708978577:web:21180db43c6aa0b5122c30"

};


firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


const db =
  firebase.firestore();


/* =========================
   VARIÁVEIS
========================= */

let D = {

  events: [],
  tasks: [],
  notes: []

};

let M =
  new Date();

let TYPE =
  "event";

let EDIT_ID =
  null;

let ready =
  false;

let selectedDate =
  null;


/* =========================
   ATALHOS
========================= */

const $ =
  selector =>
    document.querySelector(
      selector
    );


const $$ =
  selector =>
    document.querySelectorAll(
      selector
    );


/* =========================
   DATA DE HOJE
========================= */

function today(){

  const d =
    new Date();

  return (

    d.getFullYear() +

    "-" +

    String(
      d.getMonth() + 1
    ).padStart(2,"0") +

    "-" +

    String(
      d.getDate()
    ).padStart(2,"0")

  );

}


/* =========================
   SEGURANÇA HTML
========================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    c => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])
  );

}


/* =========================
   FORMATAÇÃO
========================= */

function fmt(date){

  if(!date)
    return "";

  return new Date(
    date + "T12:00:00"
  )
  .toLocaleDateString(
    "pt-BR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* =========================
   ABRIR GOOGLE MAPS
========================= */

function openMaps(location){

  if(!location)
    return;

  const query =
    encodeURIComponent(
      location
    );

  const mapsApp =
    "googlemaps://?q=" +
    query;

  const mapsWeb =
    "https://www.google.com/maps/search/?api=1&query=" +
    query;

  /*
    Primeiro tenta abrir o aplicativo
    Google Maps.

    Se o aplicativo não responder,
    abre o Google Maps pelo navegador.
  */

  window.location.href =
    mapsApp;

  setTimeout(
    () => {

      window.location.href =
        mapsWeb;

    },
    700
  );

}


/* =========================
   RENDERIZAR TAREFA
========================= */

function task(t){

  const priority =
    t.priority || "Normal";

  const priorityClass =
    priority == "Alta"
      ? "priority-alta"
      : priority == "Baixa"
        ? "priority-baixa"
        : "priority-normal";

  return `

    <div class="item">

      <div class="task-line">

        <input
          type="checkbox"
          data-toggle="${esc(t.id)}"
          ${t.done ? "checked" : ""}>

        <div style="flex:1">

          <div
            style="
              display:flex;
              align-items:center;
              flex-wrap:wrap;
              gap:4px;
            "
            class="${t.done ? "done" : ""}">

            <b>
              ${esc(t.title)}
            </b>

            <span class="priority ${priorityClass}">
              ${esc(priority)}
            </span>

          </div>

        </div>

      </div>


      <div class="item-actions">

        <button
          class="edit"
          data-edit-task="${esc(t.id)}">

          ✏️ Editar

        </button>


        <button
          class="danger"
          data-dt="${esc(t.id)}">

          🗑️ Excluir

        </button>

      </div>

    </div>

  `;

}


/* =========================
   RENDERIZAÇÃO
========================= */

function render(){

  const n =
    new Date();


  $("#date").textContent =
    n.toLocaleDateString(
      "pt-BR",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    );


  $("#ec").textContent =
    D.events.length;


  $("#tc").textContent =
    D.tasks.filter(
      x => !x.done
    ).length;


  $("#nc").textContent =
    D.notes.length;


  /* COMPROMISSOS DE HOJE */

  let ev =
    [...D.events]
      .filter(
        e =>
          e.date == today()
      )
      .sort(
        (a,b) =>
          (
            a.time || ""
          )
          .localeCompare(
            b.time || ""
          )
      );


  $("#up").innerHTML =
    ev.length

    ?

    ev.map(e => `

      <div class="item">

        <div class="item-title">
          ${esc(e.title)}
        </div>

        <small>

          ${fmt(e.date)}

          ${
            e.time
            ?
            " • " +
            esc(e.time)
            :
            ""
          }

          ${
            e.location
            ?
            " • 📍 " +
            esc(e.location)
            :
            ""
          }

        </small>


        <div class="item-actions">

          ${
            e.location
            ?
            `
            <button
              type="button"
              class="map-button"
              data-maps="${esc(e.location)}">

              📍 Ver no mapa

            </button>
            `
            :
            ""
          }


          <button
            class="edit"
            data-edit-event="${esc(e.id)}">

            ✏️ Editar

          </button>


          <button
            class="danger"
            data-de="${esc(e.id)}">

            🗑️ Excluir

          </button>

        </div>

      </div>

    `).join("")

    :

    `

      <div class="muted">
        Nenhum compromisso para hoje.
      </div>

    `;


  /* TAREFAS */

  $("#today").innerHTML =
    D.tasks.length

    ?

    [...D.tasks]
      .sort((a,b) => {

        const ordem = {
          "Alta": 1,
          "Normal": 2,
          "Baixa": 3
        };

        return (
          (ordem[a.priority] || 2) -
          (ordem[b.priority] || 2)
        );

      })
      .map(task)
      .join("")

    :

    `

      <div class="muted">
        Nenhuma tarefa cadastrada.
      </div>

    `;


  /* TODAS AS TAREFAS */

  $("#tasksList").innerHTML =
    D.tasks.length

    ?

    [...D.tasks]
      .sort((a,b) => {

        const ordem = {
          "Alta": 1,
          "Normal": 2,
          "Baixa": 3
        };

        return (
          (ordem[a.priority] || 2) -
          (ordem[b.priority] || 2)
        );

      })
      .map(task)
      .join("")

    :

    `

      <div class="muted">
        Nenhuma tarefa cadastrada.
      </div>

    `;


  /* EVENTOS */

  let events =
    [...D.events];

  if(selectedDate){

    events =
      events.filter(
        e =>
          e.date ==
          selectedDate
      );

  }


  events =
    events.sort(
      (a,b) =>
        (
          a.date +
          (a.time || "")
        )
        .localeCompare(
          b.date +
          (b.time || "")
        )
    );


  $("#events").innerHTML =
    events.length

    ?

    events.map(e => `

      <div class="item">

        <div class="item-title">
          ${esc(e.title)}
        </div>

        <small>

          📅 ${fmt(e.date)}

          ${
            e.time
            ?
            " • ⏰ " +
            esc(e.time)
            :
            ""
          }

          ${
            e.location
            ?
            " • 📍 " +
            esc(e.location)
            :
            ""
          }

        </small>


        ${
          e.notes
          ?

          `<div
            class="muted"
            style="margin-top:7px">

            ${esc(e.notes)}

          </div>`

          :

          ""
        }


        <div class="item-actions">

          ${
            e.location
            ?
            `
            <button
              type="button"
              class="map-button"
              data-maps="${esc(e.location)}">

              📍 Ver no mapa

            </button>
            `
            :
            ""
          }


          <button
            class="edit"
            data-edit-event="${esc(e.id)}">

            ✏️ Editar

          </button>


          <button
            class="danger"
            data-de="${esc(e.id)}">

            🗑️ Excluir

          </button>

        </div>

      </div>

    `).join("")

    :

    `

      <div class="muted">

        ${
          selectedDate
          ?
          "Nenhum compromisso neste dia."
          :
          "Nenhum compromisso cadastrado."
        }

      </div>

    `;


  /* TÍTULO DOS COMPROMISSOS */

  if(selectedDate){

    $("#eventsTitle").textContent =
      "Compromissos de " +
      fmt(selectedDate);

    $("#showAll").style.display =
      "block";

  }else{

    $("#eventsTitle").textContent =
      "Compromissos";

    $("#showAll").style.display =
      "none";

  }


  /* CALENDÁRIO */

  let y =
    M.getFullYear();


  let m =
    M.getMonth();


  let days =
    new Date(
      y,
      m + 1,
      0
    ).getDate();


  let first =
    new Date(
      y,
      m,
      1
    ).getDay();


  $("#month").textContent =
    new Date(
      y,
      m,
      1
    )
    .toLocaleDateString(
      "pt-BR",
      {
        month:"long",
        year:"numeric"
      }
    );


  let c =
    "";


  for(
    let i = 0;
    i < first;
    i++
  ){

    c += "<span></span>";

  }


  for(
    let d = 1;
    d <= days;
    d++
  ){

    let ds =
      y +
      "-" +
      String(
        m + 1
      ).padStart(2,"0") +
      "-" +
      String(d)
        .padStart(2,"0");


    let has =
      D.events.some(
        e =>
          e.date == ds
      );


    c += `

      <button
        class="day ${
          ds == today()
          ? "today "
          : ""
        }${
          has
          ? "has "
          : ""
        }${
          ds == selectedDate
          ? "selected"
          : ""
        }"
        data-day="${ds}">

        ${d}

      </button>

    `;

  }


  $("#cal").innerHTML =
    c;


  /* NOTAS */

  let q =
    (
      $("#search").value ||
      ""
    )
    .toLowerCase();


  let ns =
    D.notes.filter(
      x =>
        (
          (x.title || "") +
          " " +
          (x.text || "")
        )
        .toLowerCase()
        .includes(q)
    );


  $("#notesList").innerHTML =
    ns.length

    ?

    ns.map(x => `

      <div class="note">

        <div class="row">

          <b>
            ${esc(x.title)}
          </b>

        </div>


        <p>
          ${esc(x.text)}
        </p>


        <div class="item-actions">

          <button
            class="edit"
            data-edit-note="${esc(x.id)}">

            ✏️ Editar

          </button>


          <button
            class="danger"
            data-dn="${esc(x.id)}">

            🗑️ Excluir

          </button>

        </div>

      </div>

    `).join("")

    :

    `

      <div class="muted">
        Nenhuma anotação encontrada.
      </div>

    `;

}

   NAVEGAÇÃO

function go(id){

  $$("section")
    .forEach(
      x =>
        x.classList.remove(

        )
    );


  $("#" + id)
    .classList.add(
      "active"
    );


  $$("[data-go]")
    .forEach(

}


$$("[data-go]")

/* =========================
   ABRIR FORMULÁRIO
========================= */

function open(
  type,
  date = "",
  edit = null
){

  TYPE =
    type;


  EDIT_ID =
    edit
    ?
    edit.id
    :
    null;


  $("#modal")
    .classList.add(
      "show"
    );


  $("#mtitle").textContent =

    edit

    ?

    (
      type == "event"
      ?
      "Editar compromisso"

      :

      type == "task"
      ?
      "Editar tarefa"

      :
      "Editar anotação"
    )

    :

    (
      type == "event"
      ?
      "Novo compromisso"

      :

      type == "task"
      ?
      "Nova tarefa"

      :
      "Nova anotação"
    );


  let f =
    $("#form");


  /* =========================
     COMPROMISSO
  ========================= */

  if(
    type == "event"
  ){

    f.innerHTML = `

      <label>

        Título

        <input
          name="title"
          required
          value="${esc(
            edit?.title ||
            ""
          )}">

      </label>


      <label>

        Data

        <input
          name="date"
          type="date"
          required
          value="${esc(
            edit?.date ||
            date ||
            today()
          )}">

      </label>


      <label>

        Horário

        <input
          name="time"
          type="time"
          value="${esc(
            edit?.time ||
            ""
          )}">

      </label>


      <label>

        📍 Localização

        <input
          name="location"
          placeholder="Ex.: Hospital de Base, Brasília"
          value="${esc(
            edit?.location ||
            ""
          )}">

      </label>


      <label>

        Observações

        <textarea
          name="notes">${esc(
            edit?.notes ||
            ""
          )}</textarea>

      </label>


      <div class="actions">

        <button
          type="button"
          class="icon"
          id="cancel">

          Cancelar

        </button>


        <button
          class="primary">

          💾 Salvar

        </button>

      </div>

    `;

  }


  /* =========================
     TAREFA
  ========================= */

  if(
    type == "task"
  ){

    f.innerHTML = `

      <label>

        Tarefa

        <input
          name="title"
          required
          value="${esc(
            edit?.title ||
            ""
          )}">

      </label>


      <label>

        Prioridade

        <select name="priority">

          <option
            value="Normal"
            ${
              (
                edit?.priority ||
                "Normal"
              ) == "Normal"
              ?
              "selected"
              :
              ""
            }>

            Normal

          </option>


          <option
            value="Alta"
            ${
              edit?.priority == "Alta"
              ?
              "selected"
              :
              ""
            }>

            Alta

          </option>


          <option
            value="Baixa"
            ${
              edit?.priority == "Baixa"
              ?
              "selected"
              :
              ""
            }>

            Baixa

          </option>

        </select>

      </label>


      <div class="actions">

        <button
          type="button"
          class="icon"
          id="cancel">

          Cancelar

        </button>


        <button
          class="primary">

          💾 Salvar

        </button>

      </div>

    `;

  }


  /* =========================
     ANOTAÇÃO
  ========================= */

  if(
    type == "note"
  ){

    f.innerHTML = `

      <label>

        Título

        <input
          name="title"
          required
          value="${esc(
            edit?.title ||
            ""
          )}">

      </label>


      <label>

        Texto

        <textarea
          name="text"
          required>${esc(
            edit?.text ||
            ""
          )}</textarea>

      </label>


      <div class="actions">

        <button
          type="button"
          class="icon"
          id="cancel">

          Cancelar

        </button>


        <button
          class="primary">

          💾 Salvar

        </button>

      </div>

    `;

  }


  $("#cancel").onclick =
    close;

}


/* =========================
   FECHAR
========================= */

function close(){

  $("#modal")
    .classList.remove(
      "show"
    );

  EDIT_ID =
    null;

}


$("#close").onclick =
  close;


/* =========================
   ADICIONAR
========================= */

async function addDoc(
  type,
  o
){

  if(
    !auth.currentUser
  )
    return;


  const ref =
    db
      .collection("agenda")
      .doc();


  o.id =
    ref.id;


  o.type =
    type;


  o.userId =
    auth.currentUser.uid;


  o.createdAt =
    firebase.firestore
      .FieldValue
      .serverTimestamp();


  await ref.set(
    o
  );

}


/* =========================
   EXCLUIR
========================= */

async function delDoc(
  id
){

  await db
    .collection("agenda")
    .doc(id)
    .delete();

}


/* =========================
   EDITAR
========================= */

async function updateDoc(
  id,
  data
){

  await db
    .collection("agenda")
    .doc(id)
    .update({

      ...data,

      updatedAt:
        firebase.firestore
          .FieldValue
          .serverTimestamp()

    });

}


/* =========================
   SALVAR FORMULÁRIO
========================= */

$("#form").onsubmit =
  async e => {

    e.preventDefault();


    if(!ready)
      return;


    let o =
      Object.fromEntries(
        new FormData(
          e.target
        )
      );


    try{

      /* EDITANDO */

      if(
        EDIT_ID
      ){

        if(
          TYPE == "task"
        ){

          const old =
            D.tasks.find(
              x =>
                x.id ==
                EDIT_ID
            );


          o.done =
            old
            ?
            !!old.done
            :
            false;

        }


        await updateDoc(
          EDIT_ID,
          o
        );

      }


      /* NOVO */

      else{

        if(
          TYPE == "task"
        ){

          o.done =
            false;

        }


        await addDoc(
          TYPE,
          o
        );

      }


      close();


    }catch(err){

      console.error(
        err
      );


      alert(
        "Não foi possível salvar. " +
        "Verifique sua conexão."
      );

    }

  };


/* =========================
   CLIQUES
========================= */

document.addEventListener(
  "click",
  async e => {

    /* ABRIR MAPS */

    let map =
      e.target.closest(
        "[data-maps]"
      );


    if(map){

      openMaps(
        map.dataset.maps
      );

      return;

    }


    /* NOVO */

    let n =
      e.target.closest(
        "[data-new]"
      );


    if(n){

      open(
        n.dataset.new
      );

      return;

    }


    /* EXCLUIR TAREFA */

    let d =
      e.target.closest(
        "[data-dt]"
      );


    if(d){

      if(
        confirm(
          "Excluir esta tarefa?"
        )
      ){

        try{

          await delDoc(
            d.dataset.dt
          );

        }catch(err){

          alert(
            "Erro ao excluir."
          );

        }

      }

      return;

    }


    /* EXCLUIR EVENTO */

    let de =
      e.target.closest(
        "[data-de]"
      );


    if(de){

      if(
        confirm(
          "Excluir este compromisso?"
        )
      ){

        try{

          await delDoc(
            de.dataset.de
          );

        }catch(err){

          alert(
            "Erro ao excluir."
          );

        }

      }

      return;

    }


    /* EXCLUIR NOTA */

    let dn =
      e.target.closest(
        "[data-dn]"
      );


    if(dn){

      if(
        confirm(
          "Excluir esta anotação?"
        )
      ){

        try{

          await delDoc(
            dn.dataset.dn
          );

        }catch(err){

          alert(
            "Erro ao excluir."
          );

        }

      }

      return;

    }


    /* CONCLUIR TAREFA */

    let tg =
      e.target.closest(
        "[data-toggle]"
      );


    if(tg){

      try{

        await updateDoc(
          tg.dataset.toggle,
          {
            done:
              tg.checked
          }
        );

      }catch(err){

        alert(
          "Erro ao atualizar."
        );

      }

      return;

    }


    /* EDITAR EVENTO */

    let ee =
      e.target.closest(
        "[data-edit-event]"
      );


    if(ee){

      let x =
        D.events.find(
          v =>
            v.id ==
            ee.dataset.editEvent
        );


      if(x){

        open(
          "event",
          "",
          x
        );

      }

      return;

    }


    /* EDITAR TAREFA */

    let et =
      e.target.closest(
        "[data-edit-task]"
      );


    if(et){

      let x =
        D.tasks.find(
          v =>
            v.id ==
            et.dataset.editTask
        );


      if(x){

        open(
          "task",
          "",
          x
        );

      }

      return;

    }


    /* EDITAR NOTA */

    let en =
      e.target.closest(
        "[data-edit-note]"
      );


    if(en){

      let x =
        D.notes.find(
          v =>
            v.id ==
            en.dataset.editNote
        );


      if(x){

        open(
          "note",
          "",
          x
        );

      }

      return;

    }


    /* CLICAR NO DIA DO CALENDÁRIO */

    let day =
      e.target.closest(
        "[data-day]"
      );


    if(day){

      selectedDate =
        day.dataset.day;

      render();

      return;

    }

  }
);

/* =========================
   FIREBASE EM TEMPO REAL
========================= */

function listen(){

  db.collection("agenda")
    .onSnapshot(

      snapshot => {

        D = {

          events: [],
          tasks: [],
          notes: []

        };


        snapshot.forEach(
          doc => {

            const x =
              doc.data();


            x.id =
              doc.id;


            if(
              x.type ==
              "event"
            ){

              D.events.push(
                x
              );

            }

            else if(
              x.type ==
              "task"
            ){

              D.tasks.push(
                x
              );

            }

            else if(
              x.type ==
              "note"
            ){

              D.notes.push(
                x
              );

            }

          }
        );


        ready =
          true;


        render();

      },


      error => {

        console.error(
          error
        );


        alert(
          "Erro ao sincronizar a agenda."
        );

      }

    );

}


/* =========================
   LOGIN ANÔNIMO
========================= */

async function startApp(){

  try{

    if(
      !auth.currentUser
    ){

      await auth
        .signInAnonymously();

    }


    listen();

  }catch(err){

    console.error(
      err
    );


    alert(
      "Não foi possível conectar à agenda.\n\n" +
      "Verifique se o login anônimo está ativado no Firebase."
    );

  }

}


/* =========================
   INICIAR
========================= */

startApp();
