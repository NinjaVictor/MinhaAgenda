<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Minha Agenda</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">ORGANIZAÇÃO</p>
    <h1>Minha Agenda</h1>
  </div>
  <button id="themeBtn" class="icon-btn" aria-label="Alternar tema">☾</button>
</header>

<main>
  <section id="inicio" class="screen active">
    <div class="hello">
      <div>
        <p class="muted" id="dateText"></p>
        <h2>Seu dia, do seu jeito.</h2>
      </div>
      <button class="primary small" data-action="quick">＋ Adicionar</button>
    </div>

    <div class="stats">
      <div class="card stat"><span>📅</span><strong id="eventCount">0</strong><small>compromissos</small></div>
      <div class="card stat"><span>✅</span><strong id="taskCount">0</strong><small>tarefas abertas</small></div>
      <div class="card stat"><span>📝</span><strong id="noteCount">0</strong><small>notas</small></div>
    </div>

    <div class="section-head"><h3>Próximos compromissos</h3><button class="text-btn" data-tab="agenda">Ver todos</button></div>
    <div id="homeEvents" class="list"></div>

    <div class="section-head"><h3>Tarefas de hoje</h3><button class="text-btn" data-tab="tarefas">Ver todas</button></div>
    <div id="homeTasks" class="list"></div>
  </section>

  <section id="agenda" class="screen">
    <div class="section-title"><div><p class="eyebrow">CALENDÁRIO</p><h2>Agenda</h2></div><button class="primary" data-action="event">＋ Evento</button></div>
    <div class="calendar card">
      <div class="calendar-head"><button id="prevMonth">‹</button><strong id="monthTitle"></strong><button id="nextMonth">›</button></div>
      <div class="weekdays"><span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span></div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>
    <div class="section-head"><h3 id="selectedDateTitle">Compromissos</h3></div>
    <div id="eventList" class="list"></div>
  </section>

  <section id="tarefas" class="screen">
    <div class="section-title"><div><p class="eyebrow">PENDÊNCIAS</p><h2>Tarefas</h2></div><button class="primary" data-action="task">＋ Tarefa</button></div>
    <div id="taskList" class="list"></div>
    <div id="emptyTasks" class="empty">Nenhuma tarefa cadastrada.</div>
  </section>

  <section id="notas" class="screen">
    <div class="section-title"><div><p class="eyebrow">ANOTAÇÕES</p><h2>Notas</h2></div><button class="primary" data-action="note">＋ Nota</button></div>
    <input id="noteSearch" class="search" placeholder="🔎  Pesquisar notas...">
    <div id="noteList" class="notes-grid"></div>
    <div id="emptyNotes" class="empty">Nenhuma nota cadastrada.</div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav active" data-tab="inicio"><span>⌂</span><small>Início</small></button>
  <button class="nav" data-tab="agenda"><span>▣</span><small>Agenda</small></button>
  <button class="nav" data-tab="tarefas"><span>✓</span><small>Tarefas</small></button>
  <button class="nav" data-tab="notas"><span>✎</span><small>Notas</small></button>
</nav>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">Adicionar</h3><button id="closeModal" class="icon-btn">×</button></div>
    <form id="form">
      <div id="formFields"></div>
      <button class="primary full" type="submit">Salvar</button>
    </form>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
