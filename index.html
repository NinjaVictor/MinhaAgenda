<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Minha Agenda</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --danger: #ef4444;
      --success: #22c55e;
      --shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    body.dark {
      --bg: #0b1120;
      --card: #111827;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #1f2937;
      --primary: #f9fafb;
      --shadow: 0 8px 25px rgba(0,0,0,.25);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 95px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .brand h1 {
      font-size: 25px;
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: 20px;
    }

    .hero {
      background: var(--primary);
      color: var(--bg);
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 18px;
    }

    body.dark .hero {
      background: #f9fafb;
      color: #111827;
    }

    .hero .date {
      font-size: 13px;
      opacity: .7;
      margin-bottom: 10px;
    }

    .hero h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 14px;
      opacity: .7;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px 8px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 23px;
      margin-bottom: 5px;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .section {
      margin-bottom: 22px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title h3 {
      font-size: 18px;
    }

    .section-title button {
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .empty {
      text-align: center;
      padding: 28px 15px;
      color: var(--muted);
      font-size: 14px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .item-info {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .delete-btn {
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      padding: 3px;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .task-row:last-child {
      border-bottom: none;
    }

    .task-check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 7px;
      background: transparent;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .task-check.done {
      background: var(--success);
      border-color: var(--success);
    }

    .task-text {
      flex: 1;
      font-size: 14px;
    }

    .task-text.done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 620px;
      height: 68px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 23px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 50;
    }

    .nav-btn {
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 10px;
    }

    .nav-btn .icon {
      font-size: 20px;
    }

    .nav-btn.active {
      color: var(--text);
      font-weight: bold;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 95px;
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: var(--primary);
      color: var(--bg);
      font-size: 29px;
      box-shadow: 0 10px 25px rgba(0,0,0,.2);
      z-index: 40;
    }

    body.dark .fab {
      background: #f9fafb;
      color: #111827;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .calendar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .calendar-header strong {
      font-size: 16px;
      text-transform: capitalize;
    }

    .calendar-header button {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
    }

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      font-weight: bold;
      padding-bottom: 7px;
    }

    .day {
      aspect-ratio: 1;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      position: relative;
    }

    .day.today {
      background: var(--primary);
      color: var(--bg);
      font-weight: bold;
    }

    body.dark .day.today {
      background: #f9fafb;
      color: #111827;
    }

    .day.selected {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }

    .day.has-event::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--success);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 13px;
      padding: 12px;
      outline: none;
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      color: var(--text);
      border-radius: 28px 28px 0 0;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 20px;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 20px;
    }

    .save-btn {
      width: 100%;
      background: var(--primary);
      color: var(--bg);
      padding: 14px;
      border-radius: 14px;
      font-weight: bold;
      margin-top: 5px;
    }

    body.dark .save-btn {
      background: #f9fafb;
      color: #111827;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 15px;
      padding: 13px;
      outline: none;
    }

    .note {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .note-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .note-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .note-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      font-weight: bold;
    }

    .loading.hide {
      display: none;
    }

    @media (min-width: 700px) {
      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-box {
        border-radius: 28px;
      }
    }
  </style>
</head>

<body>

  <div id="loading" class="loading">
    Carregando sua agenda...
  </div>

  <main class="app">

    <header class="topbar">
      <div class="brand">
        <small>ORGANIZAÇÃO</small>
        <h1>Minha Agenda</h1>
      </div>

      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
        🌙
      </button>
    </header>


    <!-- INÍCIO -->
    <section id="page-home" class="page active">

      <div class="hero">
        <div class="date" id="heroDate"></div>
        <h2>Seu dia, do seu jeito.</h2>
        <p>Organize compromissos, tarefas e anotações.</p>
      </div>

      <div class="stats">

        <div class="stat">
          <strong id="statEvents">0</strong>
          <span>Compromissos</span>
        </div>

        <div class="stat">
          <strong id="statTasks">0</strong>
          <span>Tarefas abertas</span>
        </div>

        <div class="stat">
          <strong id="statNotes">0</strong>
          <span>Anotações</span>
        </div>

      </div>


      <div class="section">

        <div class="section-title">
          <h3>Próximos compromissos</h3>
          <button onclick="showPage('agenda')">
            Ver todos
          </button>
        </div>

        <div class="card" id="homeEvents"></div>

      </div>


      <div class="section">

        <div class="section-title">
          <h3>Tarefas de hoje</h3>
          <button onclick="showPage('tasks')">
            Ver todas
          </button>
        </div>

        <div class="card" id="homeTasks"></div>

      </div>

    </section>


    <!-- AGENDA -->
    <section id="page-agenda" class="page">

      <div class="section-title">

        <h3>Agenda</h3>

        <button onclick="openModal('event')">
          + Novo
        </button>

      </div>


      <div class="calendar-card">

        <div class="calendar-header">

          <button onclick="changeMonth(-1)">
            ‹
          </button>

          <strong id="calendarTitle"></strong>

          <button onclick="changeMonth(1)">
            ›
          </button>

        </div>


        <div class="weekdays">

          <div class="weekday">DOM</div>
          <div class="weekday">SEG</div>
          <div class="weekday">TER</div>
          <div class="weekday">QUA</div>
          <div class="weekday">QUI</div>
          <div class="weekday">SEX</div>
          <div class="weekday">SÁB</div>

        </div>


        <div class="calendar-grid" id="calendarGrid"></div>

      </div>


      <div class="section-title">

        <h3 id="selectedDateTitle">
          Compromissos
        </h3>

      </div>


      <div class="card" id="eventList"></div>

    </section>


    <!-- TAREFAS -->
    <section id="page-tasks" class="page">

      <div class="section-title">

        <h3>Tarefas</h3>

        <button onclick="openModal('task')">
          + Nova
        </button>

      </div>

      <div class="card" id="taskList"></div>

    </section>


    <!-- NOTAS -->
    <section id="page-notes" class="page">

      <div class="section-title">

        <h3>Anotações</h3>

        <button onclick="openModal('note')">
          + Nova
        </button>

      </div>


      <div class="search-box">

        <input
          type="text"
          id="noteSearch"
          placeholder="Pesquisar anotações..."
          oninput="renderNotes()"
        >

      </div>


      <div id="noteList"></div>

    </section>

  </main>


  <!-- BOTÃO + -->
  <button class="fab" onclick="openModal()">
    +
  </button>


  <!-- MENU INFERIOR -->
  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      data-page="home"
      onclick="showPage('home')"
    >
      <span class="icon">⌂</span>
      <span>Início</span>
    </button>


    <button
      class="nav-btn"
      data-page="agenda"
      onclick="showPage('agenda')"
    >
      <span class="icon">▣</span>
      <span>Agenda</span>
    </button>


    <button
      class="nav-btn"
      data-page="tasks"
      onclick="showPage('tasks')"
    >
      <span class="icon">✓</span>
      <span>Tarefas</span>
    </button>


    <button
      class="nav-btn"
      data-page="notes"
      onclick="showPage('notes')"
    >
      <span class="icon">☷</span>
      <span>Notas</span>
    </button>

  </nav>


  <!-- MODAL -->
  <div class="modal" id="modal">

    <div class="modal-box">

      <div class="modal-header">

        <h3 id="modalTitle">
          Novo item
        </h3>

        <button class="close-btn" onclick="closeModal()">
          ×
        </button>

      </div>


      <form id="itemForm">

        <input
          type="hidden"
          id="editId"
        >


        <div class="form-group">

          <label>Tipo</label>

          <select
            id="itemType"
            onchange="updateFormFields()"
          >

            <option value="event">
              Compromisso
            </option>

            <option value="task">
              Tarefa
            </option>

            <option value="note">
              Anotação
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="itemTitle">
            Título
          </label>

          <input
            id="itemTitle"
            type="text"
            placeholder="Digite um título"
            required
          >

        </div>


        <div class="form-group" id="dateGroup">

          <label for="itemDate">
            Data
          </label>

          <input
            id="itemDate"
            type="date"
          >

        </div>


        <div class="form-group" id="timeGroup">

          <label for="itemTime">
            Horário
          </label>

          <input
            id="itemTime"
            type="time"
          >

        </div>


        <div class="form-group">

          <label for="itemDescription">
            Descrição
          </label>

          <textarea
            id="itemDescription"
            placeholder="Digite os detalhes..."
          ></textarea>

        </div>


        <button
          class="save-btn"
          type="submit"
        >
          Salvar
        </button>

      </form>

    </div>

  </div>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>


  <script>

    // ==========================================
    // CONFIGURAÇÃO DO FIREBASE
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyAsf0YLK7c5FOBuw8q05iETDIGTjANkHKE",
      authDomain: "minha-agenda-253ad.firebaseapp.com",
      projectId: "minha-agenda-253ad",
      storageBucket: "minha-agenda-253ad.firebasestorage.app",
      messagingSenderId: "56708978577",
      appId: "1:56708978577:web:21180db43c6aa0b5122c30"
    };


    firebase.initializeApp(firebaseConfig);


    const auth = firebase.auth();

    const db = firebase.firestore();

    const agendaRef = db.collection("agenda");


    // ==========================================
    // VARIÁVEIS
    // ==========================================

    let currentUser = null;

    let items = [];

    let currentDate = new Date();

    let selectedDate = new Date();


    // ==========================================
    // DATA LOCAL
    // ==========================================

    function localDateString(date = new Date()) {

      const year = date.getFullYear();

      const month = String(
        date.getMonth() + 1
      ).padStart(2, "0");

      const day = String(
        date.getDate()
      ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    // ==========================================
    // DATA FORMATADA
    // ==========================================

    function formatDate(dateString) {

      if (!dateString) return "";

      const parts = dateString.split("-");

      if (parts.length !== 3) return dateString;

      const date = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );

      return date.toLocaleDateString(
        "pt-BR",
        {
          weekday: "long",
          day: "2-digit",
          month: "long"
        }
      );
    }


    // ==========================================
    // LOGIN AUTOMÁTICO
    // ==========================================

    auth.onAuthStateChanged(async user => {

      if (user) {

        currentUser = user;

        iniciarSincronizacao();

      } else {

        try {

          await auth.signInAnonymously();

        } catch (error) {

          console.error(error);

          alert(
            "Não foi possível conectar ao Firebase. Verifique se o login anônimo está ativado."
          );

          document
            .getElementById("loading")
            .classList.add("hide");
        }

      }

    });


    // ==========================================
    // SINCRONIZAÇÃO FIRESTORE
    // ==========================================

    function iniciarSincronizacao() {

      agendaRef
        .orderBy("createdAt", "desc")
        .onSnapshot(
          snapshot => {

            items = [];

            snapshot.forEach(doc => {

              items.push({
                firestoreId: doc.id,
                ...doc.data()
              });

            });


            renderAll();


            document
              .getElementById("loading")
              .classList.add("hide");

          },

          error => {

            console.error(error);

            document
              .getElementById("loading")
              .classList.add("hide");

            alert(
              "Erro ao sincronizar a agenda com o Firebase."
            );

          }
        );

    }


    // ==========================================
    // NAVEGAÇÃO
    // ==========================================

    function showPage(page) {

      document
        .querySelectorAll(".page")
        .forEach(element => {

          element.classList.remove("active");

        });


      const target =
        document.getElementById(
          "page-" + page
        );


      if (target) {

        target.classList.add("active");

      }


      document
        .querySelectorAll(".nav-btn")
        .forEach(button => {

          button.classList.remove("active");

          if (
            button.dataset.page === page
          ) {

            button.classList.add("active");

          }

        });


      if (page === "agenda") {

        renderCalendar();

        renderEvents();

      }

      if (page === "tasks") {

        renderTasks();

      }

      if (page === "notes") {

        renderNotes();

      }

    }


    // ==========================================
    // TEMA
    // ==========================================

    function toggleTheme() {

      document.body.classList.toggle("dark");

      const dark =
        document.body.classList.contains("dark");


      localStorage.setItem(
        "darkMode",
        dark ? "1" : "0"
      );


      document.getElementById(
        "themeBtn"
      ).textContent = dark ? "☀️" : "🌙";

    }


    function loadTheme() {

      const dark =
        localStorage.getItem("darkMode") === "1";


      if (dark) {

        document.body.classList.add("dark");

        document.getElementById(
          "themeBtn"
        ).textContent = "☀️";

      }

    }


    // ==========================================
    // MODAL
    // ==========================================

    function openModal(type = "event") {

      const modal =
        document.getElementById("modal");


      document
        .getElementById("itemForm")
        .reset();


      document
        .getElementById("editId")
        .value = "";


      document
        .getElementById("itemType")
        .value = type;


      document
        .getElementById("itemDate")
        .value =
        localDateString(selectedDate);


      document
        .getElementById("modalTitle")
        .textContent =
        type === "event"
          ? "Novo compromisso"
          : type === "task"
            ? "Nova tarefa"
            : "Nova anotação";


      updateFormFields();


      modal.classList.add("show");

    }


    function closeModal() {

      document
        .getElementById("modal")
        .classList.remove("show");

    }


    function updateFormFields() {

      const type =
        document.getElementById(
          "itemType"
        ).value;


      const dateGroup =
        document.getElementById(
          "dateGroup"
        );


      const timeGroup =
        document.getElementById(
          "timeGroup"
        );


      if (type === "event") {

        dateGroup.style.display = "block";

        timeGroup.style.display = "block";

      }

      else {

        dateGroup.style.display = "none";

        timeGroup.style.display = "none";

      }

    }


    // ==========================================
    // SALVAR
    // ==========================================

    document
      .getElementById("itemForm")
      .addEventListener("submit", async event => {

        event.preventDefault();


        if (!currentUser) {

          alert("Aguarde a conexão com o Firebase.");

          return;

        }


        const type =
          document.getElementById(
            "itemType"
          ).value;


        const title =
          document.getElementById(
            "itemTitle"
          ).value.trim();


        const description =
          document.getElementById(
            "itemDescription"
          ).value.trim();


        const date =
          document.getElementById(
            "itemDate"
          ).value;


        const time =
          document.getElementById(
            "itemTime"
          ).value;


        const editId =
          document.getElementById(
            "editId"
          ).value;


        if (!title) {

          alert("Digite um título.");

          return;

        }


        const data = {

          type: type,

          title: title,

          description: description,

          date:
            type === "event"
              ? date
              : "",

          time:
            type === "event"
              ? time
              : "",

          completed: false,

          userId: currentUser.uid,

          createdAt:
            firebase.firestore.FieldValue.serverTimestamp()

        };


        try {

          if (editId) {

            await agendaRef
              .doc(editId)
              .update(data);

          }

          else {

            await agendaRef
              .add(data);

          }


          closeModal();

        }

        catch (error) {

          console.error(error);

          alert(
            "Erro ao salvar. Tente novamente."
          );

        }

      });


    // ==========================================
    // EXCLUIR
    // ==========================================

    async function deleteItem(id) {

      if (!confirm("Excluir este item?")) {

        return;

      }


      try {

        await agendaRef
          .doc(id)
          .delete();

      }

      catch (error) {

        console.error(error);

        alert(
          "Não foi possível excluir."
        );

      }

    }


    // ==========================================
    // CONCLUIR TAREFA
    // ==========================================

    async function toggleTask(id, completed) {

      try {

        await agendaRef
          .doc(id)
          .update({
            completed: !completed
          });

      }

      catch (error) {

        console.error(error);

        alert(
          "Não foi possível atualizar a tarefa."
        );

      }

    }


    // ==========================================
    // CALENDÁRIO
    // ==========================================

    function changeMonth(direction) {

      currentDate.setMonth(
        currentDate.getMonth() + direction
      );

      renderCalendar();

    }


    function renderCalendar() {

      const year =
        currentDate.getFullYear();

      const month =
        currentDate.getMonth();


      const monthName =
        currentDate.toLocaleDateString(
          "pt-BR",
          {
            month: "long",
            year: "numeric"
          }
        );


      document.getElementById(
        "calendarTitle"
      ).textContent = monthName;


      const grid =
        document.getElementById(
          "calendarGrid"
        );


      grid.innerHTML = "";


      const firstDay =
        new Date(
          year,
          month,
          1
        ).getDay();


      const daysInMonth =
        new Date(
          year,
          month + 1,
          0
        ).getDate();


      for (
        let i = 0;
        i < firstDay;
        i++
      ) {

        const empty =
          document.createElement("div");

        grid.appendChild(empty);

      }


      const today =
        localDateString();


      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {

        const dateString =
          `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;


        const button =
          document.createElement("button");


        button.className = "day";

        button.textContent = day;


        if (dateString === today) {

          button.classList.add("today");

        }


        if (
          dateString ===
          localDateString(selectedDate)
        ) {

          button.classList.add("selected");

        }


        if (
          items.some(
            item =>
              item.type === "event" &&
              item.date === dateString
          )
        ) {

          button.classList.add("has-event");

        }


        button.onclick = () => {

          selectedDate =
            new Date(
              year,
              month,
              day
            );

          renderCalendar();

          renderEvents();

        };


        grid.appendChild(button);

      }

    }


    // ==========================================
    // COMPROMISSOS
    // ==========================================

    function renderEvents() {

      const date =
        localDateString(selectedDate);


      document.getElementById(
        "selectedDateTitle"
      ).textContent =
        "Compromissos de " +
        selectedDate.toLocaleDateString(
          "pt-BR"
        );


      const list =
        document.getElementById(
          "eventList"
        );


      const events =
        items
          .filter(
            item =>
              item.type === "event" &&
              item.date === date
          )
          .sort(
            (a, b) =>
              (a.time || "")
                .localeCompare(
                  b.time || ""
                )
          );


      if (!events.length) {

        list.innerHTML = `
          <div class="empty">
            Nenhum compromisso para este dia.
          </div>
        `;

        return;

      }


      list.innerHTML =
        events
          .map(event => `

            <div class="item">

              <div class="item-dot"></div>

              <div class="item-content">

                <div class="item-title">
                  ${escapeHtml(event.title)}
                </div>

                <div class="item-info">

                  ${event.time
                    ? "🕐 " +
                      escapeHtml(event.time)
                    : ""
                  }

                  ${
                    event.description
                      ? "<br>" +
                        escapeHtml(
                          event.description
                        )
                      : ""
                  }

                </div>

              </div>

              <button
                class="delete-btn"
                onclick="deleteItem('${event.firestoreId}')"
              >
                ×
              </button>

            </div>

          `)
          .join("");

    }


    // ==========================================
    // TAREFAS
    // ==========================================

    function renderTasks() {

      const list =
        document.getElementById(
          "taskList"
        );


      const tasks =
        items.filter(
          item =>
            item.type === "task"
        );


      if (!tasks.length) {

        list.innerHTML = `
          <div class="empty">
            Nenhuma tarefa cadastrada.
          </div>
        `;

        return;

      }


      list.innerHTML =
        tasks
          .map(task => `

            <div class="task-row">

              <button
                class="task-check ${
                  task.completed
                    ? "done"
                    : ""
                }"
                onclick="toggleTask(
                  '${task.firestoreId}',
                  ${task.completed ? "true" : "false"}
                )"
              >
                ${
                  task.completed
                    ? "✓"
                    : ""
                }
              </button>


              <div
                class="task-text ${
                  task.completed
                    ? "done"
                    : ""
                }"
              >
                ${escapeHtml(task.title)}
              </div>


              <button
                class="delete-btn"
                onclick="deleteItem('${task.firestoreId}')"
              >
                ×
              </button>

            </div>

          `)
          .join("");

    }


    // ==========================================
    // NOTAS
    // ==========================================

    function renderNotes() {

      const list =
        document.getElementById(
          "noteList"
        );


      const search =
        document
          .getElementById("noteSearch")
          .value
          .toLowerCase()
          .trim();


      const notes =
        items.filter(note => {

          if (note.type !== "note") {

            return false;

          }


          if (!search) {

            return true;

          }


          return (
            (note.title || "")
              .toLowerCase()
              .includes(search)
            ||
            (note.description || "")
              .toLowerCase()
              .includes(search)
          );

        });


      if (!notes.length) {

        list.innerHTML = `
          <div class="empty">
            Nenhuma anotação encontrada.
          </div>
        `;

        return;

      }


      list.innerHTML =
        notes
          .map(note => `

            <div class="note">

              <div class="note-title">
                ${escapeHtml(note.title)}
              </div>


              <div class="note-text">
                ${escapeHtml(
                  note.description || ""
                )}
              </div>


              <div class="note-footer">

                <button
                  class="delete-btn"
                  onclick="deleteItem('${note.firestoreId}')"
                >
                  Excluir
                </button>

              </div>

            </div>

          `)
          .join("");

    }


    // ==========================================
    // PÁGINA INICIAL
    // ==========================================

    function renderHome() {

      const now =
        new Date();


      document.getElementById(
        "heroDate"
      ).textContent =
        now.toLocaleDateString(
          "pt-BR",
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );


      const events =
        items.filter(
          item =>
            item.type === "event"
        );


      const openTasks =
        items.filter(
          item =>
            item.type === "task" &&
            !item.completed
        );


      const notes =
        items.filter(
          item =>
            item.type === "note"
        );


      document.getElementById(
        "statEvents"
      ).textContent =
        events.length;


      document.getElementById(
        "statTasks"
      ).textContent =
        openTasks.length;


      document.getElementById(
        "statNotes"
      ).textContent =
        notes.length;


      const homeEvents =
        document.getElementById(
          "homeEvents"
        );


      const today =
        localDateString();


      const upcoming =
        events
          .filter(
            event =>
              event.date >= today
          )
          .sort(
            (a, b) =>
              (
                a.date +
                (a.time || "")
              ).localeCompare(
                b.date +
                (b.time || "")
              )
          )
          .slice(0, 5);


      if (!upcoming.length) {

        homeEvents.innerHTML = `
          <div class="empty">
            Nenhum compromisso próximo.
          </div>
        `;

      }

      else {

        homeEvents.innerHTML =
          upcoming
            .map(event => `

              <div class="item">

                <div class="item-dot"></div>

                <div class="item-content">

                  <div class="item-title">
                    ${escapeHtml(event.title)}
                  </div>

                  <div class="item-info">

                    ${formatDate(event.date)}

                    ${
                      event.time
                        ? " • " +
                          escapeHtml(
                            event.time
                          )
                        : ""
                    }

                  </div>

                </div>

              </div>

            `)
            .join("");

      }


      const homeTasks =
        document.getElementById(
          "homeTasks"
        );


      const todayTasks =
        openTasks.slice(0, 5);


      if (!todayTasks.length) {

        homeTasks.innerHTML = `
          <div class="empty">
            Nenhuma tarefa pendente.
          </div>
        `;

      }

      else {

        homeTasks.innerHTML =
          todayTasks
            .map(task => `

              <div class="task-row">

                <button
                  class="task-check"
                  onclick="toggleTask(
                    '${task.firestoreId}',
                    false
                  )"
                >
                </button>

                <div class="task-text">
                  ${escapeHtml(task.title)}
                </div>

              </div>

            `)
            .join("");

      }

    }


    // ==========================================
    // RENDER GERAL
    // ==========================================

    function renderAll() {

      renderHome();

      renderCalendar();

      renderEvents();

      renderTasks();

      renderNotes();

    }


    // ==========================================
    // PROTEÇÃO CONTRA HTML
    // ==========================================

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ==========================================
    // FECHAR MODAL CLICANDO FORA
    // ==========================================

    document
      .getElementById("modal")
      .addEventListener(
        "click",
        event => {

          if (
            event.target.id === "modal"
          ) {

            closeModal();

          }

        }
      );


    // ==========================================
    // INICIALIZAÇÃO
    // ==========================================

    loadTheme();

    renderHome();

  </script>

</body>
</html>
